name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack the tarball, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm provenance, which attests that this tarball was built by
  # this workflow from this commit. Note: provenance needs a PUBLIC repository —
  # on a private repo, drop the --provenance flag below or the publish fails.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Never publish something CI has not just verified end to end.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify no Node-only APIs reached the bundle
        run: npm run check:edge

      - name: Validate package metadata and type resolution
        run: npm run check:package

      - name: Run the suite inside real workerd
        run: npm run test:workers

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Smoke-test the published bundle under Deno
        run: npm run test:deno

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG."
            exit 1
          fi
          echo "Publishing version $PKG"

      - name: Pack (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: npm pack --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
