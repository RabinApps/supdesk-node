name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        # Coverage thresholds are set to 80% in vitest.config.ts, so this step
        # fails the build if coverage regresses.
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify no Node-only APIs reached the bundle
        run: npm run check:edge

      - name: Validate package metadata and type resolution
        run: npm run check:package

      - name: Audit dependencies
        # The package ships zero runtime dependencies, so anything found here is
        # in the toolchain. Only high/critical block, to avoid unrelated PRs
        # being held up by a fresh moderate advisory in a dev dependency.
        run: npm audit --audit-level=high

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  workers:
    name: Cloudflare Workers (workerd)
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run the suite inside real workerd
        # No `nodejs_compat` flag: this fails if the library ever depends on a
        # Node built-in, which the Node suite could never catch.
        run: npm run test:workers

  deno:
    name: Deno
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Download the built bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Typecheck under Deno
        run: deno check test-edge/deno-smoke.ts

      - name: Smoke-test the published bundle under Deno
        # Imports dist/index.js, so this exercises exactly what ships.
        run: npm run test:deno
